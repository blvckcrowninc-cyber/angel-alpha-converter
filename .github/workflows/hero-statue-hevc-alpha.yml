name: Hero statue — HEVC Alpha for Safari

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encode:
    runs-on: macos-14
    timeout-minutes: 20

    env:
      INPUT_FILE: angel.webm
      OUTPUT_FILE: hero-statue-ios-alpha-v1.mov
      EXPECTED_SHA256: F02FAB959BEE47E7E5C7BED5AAD12EABE26BC7ED3F0D7738ED5662A1262CD3D8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check tools and exact source file
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

          test -f "$INPUT_FILE" || {
            echo "ERROR: upload $INPUT_FILE to the repository root"
            exit 1
          }

          actual_sha="$(shasum -a 256 "$INPUT_FILE" | awk '{print toupper($1)}')"
          echo "Input: $INPUT_FILE"
          echo "SHA-256: $actual_sha"

          if [[ "$actual_sha" != "$EXPECTED_SHA256" ]]; then
            echo "ERROR: this is not the Hero statue source supplied on 2026-09-01"
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $actual_sha"
            exit 1
          fi

          ffmpeg -hide_banner -version
          encoder_help="$(ffmpeg -hide_banner -h encoder=hevc_videotoolbox 2>&1)"
          grep -q alpha_quality <<<"$encoder_help" || {
            echo "ERROR: this FFmpeg build cannot encode HEVC with alpha"
            exit 1
          }

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,duration:stream_tags=alpha_mode \
            -of default=noprint_wrappers=1 \
            "$INPUT_FILE"

      - name: Verify decoded WebM alpha
        shell: bash
        run: |
          set -euo pipefail

          # libvpx-vp9 is specified explicitly: the native VP9 decoder may drop alpha.
          ffmpeg -hide_banner -v error \
            -c:v libvpx-vp9 \
            -i "$INPUT_FILE" \
            -map 0:v:0 \
            -frames:v 1 \
            -vf "format=bgra,alphaextract" \
            -f null -

      - name: Encode native HEVC with alpha
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -hide_banner -y \
            -c:v libvpx-vp9 \
            -i "$INPUT_FILE" \
            -map 0:v:0 \
            -an \
            -vf "format=bgra" \
            -c:v hevc_videotoolbox \
            -allow_sw 1 \
            -realtime 0 \
            -alpha_quality 1.0 \
            -b:v 8M \
            -maxrate 10M \
            -bufsize 16M \
            -tag:v hvc1 \
            -movflags +faststart \
            "$OUTPUT_FILE"

      - name: Prove that the MOV contains an alpha layer
        shell: bash
        run: |
          set -euo pipefail

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,codec_tag_string,width,height,duration,bit_rate \
            -of default=noprint_wrappers=1 \
            "$OUTPUT_FILE"

          ffmpeg -hide_banner -v error \
            -i "$OUTPUT_FILE" \
            -map 0:v:0 \
            -c copy \
            -bsf:v hevc_mp4toannexb \
            -f hevc hero-statue-alpha-check.hevc

          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          data = Path("hero-statue-alpha-check.hevc").read_bytes()
          nal_units = re.split(b"\x00\x00\x00\x01|\x00\x00\x01", data)
          layers = Counter()

          for nal in nal_units:
              if len(nal) < 2:
                  continue
              layer_id = ((nal[0] & 1) << 5) | ((nal[1] >> 3) & 0x1F)
              layers[layer_id] += 1

          print("HEVC NAL layers:", dict(sorted(layers.items())))
          if not layers.get(0) or not layers.get(1):
              raise SystemExit("ERROR: HEVC alpha layer 1 is missing")
          PY

      - name: Upload converted statue
        uses: actions/upload-artifact@v5
        with:
          name: hero-statue-ios-alpha-v1-${{ github.run_number }}
          path: hero-statue-ios-alpha-v1.mov
          if-no-files-found: error
          retention-days: 7
